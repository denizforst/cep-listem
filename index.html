<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#21121d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Notlarım">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="app-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>Notlarım</title>
</head>
<body>
  <main id="app" class="shell">
    <section id="lockedView" class="lock-screen" hidden>
      <div class="lock-mark">✦</div>
      <p class="eyebrow">KİŞİSEL · ÇEVRİM DIŞI</p>
      <h1 id="lockTitle">Notlarım</h1>
      <p id="lockMessage" class="muted">Notların bu cihazda şifreli saklanır.</p>
      <form id="unlockForm" class="lock-form">
        <label for="passwordInput">Parola</label>
        <input id="passwordInput" type="password" autocomplete="current-password" minlength="4" required placeholder="En az 4 karakter">
        <p id="passwordHint" class="hint" hidden>Bu parolayı unutma; sıfırlama veya kurtarma yolu yok.</p>
        <button class="primary" id="unlockButton" type="submit">Kilidi Aç</button>
        <p id="lockError" class="error" role="alert"></p>
      </form>
    </section>
    <section id="mainView" class="app-screen" hidden>
      <div id="pageContent" class="page-content"></div>
    </section>
    <dialog id="appDialog" class="app-dialog">
      <form method="dialog" class="dialog-dismiss"><button aria-label="Kapat">×</button></form>
      <h2 id="dialogTitle"></h2>
      <div id="dialogBody"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
